<script>
(function () {
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load: ' + src));
      document.body.appendChild(s);
    });
  }
  (async () => {
    try {
      await loadScript('https://id.data-viz-lectures.com/lib/dvz-share-shell.v1.js');
    } catch (_error) {
      await loadScript('js/dvz-share-shell.v1.js');
    }
    if (!window.DVZShareShell) await loadScript('js/dvz-share-shell.v1.js');
    await loadScript('js/share-runtime.js?v=3');
  })().catch((error) => {
    console.error('[weighted-directed-flow-map] share libs load failed:', error);
  });
})();
</script>
